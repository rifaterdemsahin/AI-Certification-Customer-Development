<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer | AI Certification Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="container">
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; font-weight: 500;">
            &larr; Back to Hub
        </a>

        <div class="card animate-fade-in" style="margin-bottom: 2rem; border-left: 5px solid var(--color-primary);">
            <span class="badge">Document Viewer</span>
            <h1 id="doc-title" style="font-family: var(--font-heading); font-size: 2rem; margin-bottom: 0.5rem;">Loading document&hellip;</h1>
            <p id="doc-path" style="color: var(--text-secondary); font-size: 0.9rem;"></p>
        </div>

        <div class="card animate-fade-in markdown-body" id="doc-body">
            <p style="color: var(--text-secondary);">Loading&hellip;</p>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <span class="footer-text">© 2026 AI Certification Helper. Customer Development blueprint based on Steve Blank's framework.</span>
            <span class="footer-text">Prepared for: Rifat Erdem Sahin</span>
        </div>
    </footer>

    <script src="nav.js"></script>
    <script src="main.js"></script>
    <script>
    (function () {
        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Minimal, dependency-free markdown -> HTML converter.
        // Returns { html: string, mermaidBlocks: string[] } -- mermaid source is applied
        // as textContent after insertion (see below), never through innerHTML, so that
        // literal "<br>" sequences inside node labels survive as text for Mermaid's own
        // parser instead of being turned into real <br> elements by the browser first.
        function renderMarkdown(src) {
            // Extract SVG blocks before escaping HTML
            var svgBlocks = [];
            var placeholderSrc = src.replace(/<svg[\s\S]*?<\/svg>/gi, function(match) {
                svgBlocks.push(match);
                return '___SVG_PLACEHOLDER_' + (svgBlocks.length - 1) + '___';
            });

            // Extract ```mermaid fenced blocks before escaping, so the raw diagram
            // source (including any literal "<br>" in node labels) is preserved exactly.
            var mermaidBlocks = [];
            placeholderSrc = placeholderSrc.replace(/```mermaid\n([\s\S]*?)\n```/g, function(match, code) {
                mermaidBlocks.push(code);
                return '___MERMAID_PLACEHOLDER_' + (mermaidBlocks.length - 1) + '___';
            });

            var escaped = escapeHtml(placeholderSrc);
            var lines = escaped.split('\n');
            var html = [];
            var i = 0;
            var inCode = false;
            var codeLines = [];
            var listBuffer = [];
            var listType = null; // 'ul' | 'ol'

            function flushList() {
                if (listBuffer.length) {
                    html.push('<' + listType + '>' + listBuffer.join('') + '</' + listType + '>');
                    listBuffer = [];
                    listType = null;
                }
            }

            function splitTableRow(rowLine) {
                var trimmed = rowLine.trim();
                if (trimmed.charAt(0) === '|') trimmed = trimmed.slice(1);
                if (trimmed.charAt(trimmed.length - 1) === '|') trimmed = trimmed.slice(0, -1);
                return trimmed.split('|').map(function (c) { return c.trim(); });
            }

            function inlineFormat(text) {
                // links [text](url)
                text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                // bold
                text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                // italic
                text = text.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
                // inline code
                text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
                return text;
            }

            while (i < lines.length) {
                var line = lines[i];

                // SVG placeholder block check
                if (/^___SVG_PLACEHOLDER_\d+___$/.test(line.trim())) {
                    flushList();
                    html.push(line.trim());
                    i++;
                    continue;
                }

                // Mermaid placeholder block check -- emits an empty container; the raw
                // source is assigned as textContent after insertion (see below).
                var mermaidPlaceholderMatch = line.trim().match(/^___MERMAID_PLACEHOLDER_(\d+)___$/);
                if (mermaidPlaceholderMatch) {
                    flushList();
                    html.push('<pre class="mermaid" data-mermaid-index="' + mermaidPlaceholderMatch[1] + '"></pre>');
                    i++;
                    continue;
                }

                // GFM-style table: a "| a | b |" row immediately followed by a
                // "|---|---|" separator row.
                var tableHeaderMatch = line.match(/^\s*\|(.+)\|\s*$/);
                if (tableHeaderMatch && i + 1 < lines.length &&
                    /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
                    flushList();
                    var headerCells = splitTableRow(line);
                    i += 2;
                    var bodyRows = [];
                    while (i < lines.length && /^\s*\|/.test(lines[i])) {
                        bodyRows.push(splitTableRow(lines[i]));
                        i++;
                    }
                    var tableHtml = '<div style="overflow-x:auto;"><table><thead><tr>';
                    headerCells.forEach(function (c) { tableHtml += '<th>' + inlineFormat(c) + '</th>'; });
                    tableHtml += '</tr></thead><tbody>';
                    bodyRows.forEach(function (row) {
                        tableHtml += '<tr>';
                        row.forEach(function (c) { tableHtml += '<td>' + inlineFormat(c) + '</td>'; });
                        tableHtml += '</tr>';
                    });
                    tableHtml += '</tbody></table></div>';
                    html.push(tableHtml);
                    continue;
                }

                // fenced code block
                if (/^```/.test(line)) {
                    if (!inCode) {
                        flushList();
                        inCode = true;
                        codeLines = [];
                    } else {
                        html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
                        inCode = false;
                    }
                    i++;
                    continue;
                }
                if (inCode) {
                    codeLines.push(line);
                    i++;
                    continue;
                }

                // horizontal rule
                if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
                    flushList();
                    html.push('<hr>');
                    i++;
                    continue;
                }

                // headings
                var headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
                if (headingMatch) {
                    flushList();
                    var level = headingMatch[1].length;
                    html.push('<h' + level + '>' + inlineFormat(headingMatch[2]) + '</h' + level + '>');
                    i++;
                    continue;
                }

                // blockquote
                if (/^\s*>\s?/.test(line)) {
                    flushList();
                    var quoteLines = [];
                    while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
                        quoteLines.push(inlineFormat(lines[i].replace(/^\s*>\s?/, '')));
                        i++;
                    }
                    html.push('<blockquote><p>' + quoteLines.join('<br>') + '</p></blockquote>');
                    continue;
                }

                // unordered list
                var ulMatch = line.match(/^\s*[-*]\s+(.*)$/);
                if (ulMatch) {
                    if (listType !== 'ul') { flushList(); listType = 'ul'; }
                    listBuffer.push('<li>' + inlineFormat(ulMatch[1]) + '</li>');
                    i++;
                    continue;
                }

                // ordered list
                var olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
                if (olMatch) {
                    if (listType !== 'ol') { flushList(); listType = 'ol'; }
                    listBuffer.push('<li>' + inlineFormat(olMatch[1]) + '</li>');
                    i++;
                    continue;
                }

                flushList();

                // blank line
                if (/^\s*$/.test(line)) {
                    i++;
                    continue;
                }

                // paragraph: gather consecutive non-blank plain lines
                var paraLines = [line];
                i++;
                while (i < lines.length && !/^\s*$/.test(lines[i]) &&
                       !/^```/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) &&
                       !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
                       !/^\s*>\s?/.test(lines[i]) && !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
                    paraLines.push(lines[i]);
                    i++;
                }
                html.push('<p>' + inlineFormat(paraLines.join(' ')) + '</p>');
            }

            flushList();
            if (inCode && codeLines.length) {
                html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
            }

            var renderedHtml = html.join('\n');
            for (var j = 0; j < svgBlocks.length; j++) {
                var placeholder = '___SVG_PLACEHOLDER_' + j + '___';
                renderedHtml = renderedHtml.replace(placeholder, svgBlocks[j]);
            }

            return { html: renderedHtml, mermaidBlocks: mermaidBlocks };
        }

        // Mermaid is loaded from a CDN only when a document actually contains a
        // ```mermaid block -- every other .md file on this site stays fully
        // dependency-free/offline, per this page's usual convention. If the CDN
        // is unreachable (offline), the raw diagram source stays visible as plain
        // text inside the .mermaid <pre>, which is a reasonable degradation.
        function loadMermaidThenRender() {
            if (window.mermaid) {
                runMermaid();
                return;
            }
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
            script.onload = runMermaid;
            script.onerror = function () {
                console.error('Could not load Mermaid from CDN; showing raw diagram source instead.');
            };
            document.head.appendChild(script);
        }

        function runMermaid() {
            if (!window.mermaid) return;
            var isLight = document.body.classList.contains('light-theme');
            try {
                window.mermaid.initialize({ startOnLoad: false, theme: isLight ? 'default' : 'dark', securityLevel: 'loose' });
                var result = window.mermaid.run({ querySelector: '.mermaid' });
                if (result && typeof result.catch === 'function') {
                    result.catch(function (err) { console.error('Mermaid render error:', err); });
                }
            } catch (err) {
                console.error('Mermaid render error:', err);
            }
        }

        var params = new URLSearchParams(location.search);
        var src = params.get('src');
        var titleEl = document.getElementById('doc-title');
        var pathEl = document.getElementById('doc-path');
        var bodyEl = document.getElementById('doc-body');

        if (!src) {
            titleEl.textContent = 'No document specified';
            bodyEl.innerHTML = '<p>Append <code>?src=FILENAME.md</code> to the URL, e.g. <code>markdown_renderer.html?src=HYPOTHESIS.md</code>.</p>';
        } else {
            pathEl.textContent = src;
            fetch(src)
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(function (text) {
                    var nameMatch = src.split('/').pop();
                    titleEl.textContent = nameMatch;
                    document.title = nameMatch + ' | AI Certification Helper';

                    var rendered = renderMarkdown(text);
                    bodyEl.innerHTML = rendered.html;

                    // Assign raw mermaid source as textContent (not innerHTML) so that
                    // literal "<br>" sequences inside node labels stay as text for
                    // Mermaid's own parser instead of becoming real <br> elements.
                    var mermaidEls = bodyEl.querySelectorAll('.mermaid[data-mermaid-index]');
                    if (mermaidEls.length) {
                        mermaidEls.forEach(function (el) {
                            var idx = parseInt(el.getAttribute('data-mermaid-index'), 10);
                            el.textContent = rendered.mermaidBlocks[idx] || '';
                        });
                        loadMermaidThenRender();
                    }
                })
                .catch(function (err) {
                    titleEl.textContent = 'Could not load document';
                    bodyEl.innerHTML = '<p style="color: var(--color-warning);">Could not load ' + escapeHtml(src) + ' (' + escapeHtml(err.message) + '). If you opened this file directly from disk, run it via a local web server so fetch() can read repo files.</p>';
                });
        }
    })();
    </script>
</body>
</html>
